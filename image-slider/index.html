<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Comparison Slider</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="image-before">
        <img
          src="./residiential-coloured.jpg"
          alt="residiential home "
          class="before"
        />
      </div>
      <div class="image-after">
        <img
          src="./residiential-grey.jpg"
          alt="residiential home grey"
          class="after"
        />
      </div>

      <div class="slider">
        <div class="circle">
          <span class="left-icon">&lt;</span>
          <span class="right-icon">&gt;</span>
        </div>
      </div>

      <button id="toggleBtn">Compare by sliding</button>
    </div>

    <script src="script.js "></script>
  </body>
</html>
